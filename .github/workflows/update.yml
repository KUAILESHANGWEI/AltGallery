name: Update apps.json and all-apps.json
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Merge upstream and preserve local commits
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/bebound/AltGallery.git
          if git fetch upstream '+refs/heads/*:refs/remotes/upstream/*' --tags; then
            git merge --no-edit upstream/master
          else
            echo '::warning::Upstream unavailable; retaining all archived sources and assets.'
          fi
      - name: Localize and regenerate
        run: |
          python3 .github/scripts/mirror.py --localize-only
          ./update.sh --skip-failures
      - name: Archive and verify assets
        run: python3 .github/scripts/mirror.py
      - name: Merge archived sources and build catalog
        shell: bash
        run: |
          uvx altgen merge -c assets/merge.toml apps/*/apps.json
          for source in apps/*/apps.json; do
            python3 tools/make_proxy.py "$source" "${source%/apps.json}/apps-proxy.json"
          done
          python3 tools/make_proxy.py all-apps.json all-apps-proxy.json
          python3 tools/build_site.py
          cp archive-manifest.json SHA256SUMS _site/
          cp -R assets apps _site/
          (cd _site && zip -qr ../AltGallery-catalog.zip .)
      - name: Commit generated catalog
        run: |
          git add -A
          git add -f all-apps.json all-apps-proxy.json apps/*/apps.json apps/*/apps-proxy.json
          git diff --cached --quiet || git commit -m 'chore: sync upstream and retain verified archives'
          git push origin HEAD:main
          git push origin 'refs/remotes/upstream/*:refs/heads/archive/upstream/*'
          git push origin --tags
      - name: Publish retained snapshot
        shell: bash
        run: |
          tag="catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" AltGallery-catalog.zip SHA256SUMS archive-manifest.json all-apps.json -R "$GITHUB_REPOSITORY" --target main --title "$tag" --notes 'Catalog snapshot and verified dependency archive. Private repositories require GitHub authentication.' --latest
